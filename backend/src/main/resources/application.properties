spring.application.name=backend

# Firebase Realtime Database
firebase.database.url=https://ticketreservationapp-65cce-default-rtdb.firebaseio.com/
firebase.service.account=firebase-service-account.json

# HTTP Session
server.servlet.session.timeout=30m

# Mail (SMTP) — replace with real credentials before running
spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=username
spring.mail.password=password
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# SMS (Twilio). Leave empty for local/dev — messages are logged instead of sent.
app.sms.twilio-account-sid=
app.sms.twilio-auth-token=
app.sms.twilio-from-number=

# Concurrency-friendly defaults for the embedded server (stateless API + Firebase backend).
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10