spring.application.name=backend

# Merge secrets from this file if present (file is gitignored — copy from application-local.properties.example).
spring.config.import=optional:classpath:application-local.properties

# Firebase Realtime Database
firebase.database.url=https://ticketreservationapp-65cce-default-rtdb.firebaseio.com/
firebase.service.account=firebase-service-account.json

# HTTP Session
server.servlet.session.timeout=30m

# Mail (SMTP) — credentials live in application-local.properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# --- Mailtrap (uncomment in this file OR set host/port in application-local.properties) ---
#spring.mail.host=sandbox.smtp.mailtrap.io
#spring.mail.port=2525

# --- Gmail defaults (account + password: application-local.properties) ---
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# SMS (Twilio). Override in application-local.properties if needed.
app.sms.twilio-account-sid=
app.sms.twilio-auth-token=
app.sms.twilio-from-number=

# Concurrency-friendly defaults for the embedded server (stateless API + Firebase backend).
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
