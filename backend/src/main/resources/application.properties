spring.application.name=backend

# Merge secrets from this file if present (file is gitignored — copy from application-local.properties.example).
spring.config.import=optional:classpath:application-local.properties

# Firebase Realtime Database
firebase.database.url=https://ticketreservationapp-65cce-default-rtdb.firebaseio.com/
firebase.service.account=firebase-service-account.json

# HTTP Session
server.servlet.session.timeout=30m

# Mail (SMTP) — set spring.mail.username, spring.mail.password, app.mail.from in application-local.properties
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.host=smtp.gmail.com
spring.mail.port=587

# Concurrency-friendly defaults for the embedded server (stateless API + Firebase backend).
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10

# Phone numbers are stored and validated as E.164 (e.g. +15145550199).
app.phone.default-region=CA

# SMS (Twilio): set app.sms.enabled and credentials in application-local.properties (see example file).
