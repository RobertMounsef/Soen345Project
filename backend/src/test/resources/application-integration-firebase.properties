# Profile: integration-firebase — real RTDB tests (requires firebase-service-account.json on classpath).
# Database URL can be overridden for forks: -DFIREBASE_DATABASE_URL=...

spring.application.name=backend-integration-test

firebase.database.url=${FIREBASE_DATABASE_URL:https://ticketreservationapp-65cce-default-rtdb.firebaseio.com/}
firebase.service.account=${FIREBASE_SERVICE_ACCOUNT_FILE:firebase-service-account.json}

# firebase.database.path-prefix is set via @DynamicPropertySource in tests

spring.mail.host=sandbox.smtp.mailtrap.io
spring.mail.port=2525
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
app.mail.from=test@example.org

app.sms.twilio-account-sid=
app.sms.twilio-auth-token=
app.sms.twilio-from-number=

server.servlet.session.timeout=30m
